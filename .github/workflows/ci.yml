name: macOS checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1, 2026-10-16
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"
      - run: swift --version
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: scripts/build-app.sh --debug
      - run: scripts/swift.sh test
      - run: scripts/build-app.sh
      - run: ditto -c -k --sequesterRsrc --keepParent dist/Candy-theand-fork.app dist/Candy-theand-fork-macOS.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Candy-theand-fork-macOS
          path: dist/Candy-theand-fork-macOS.zip
